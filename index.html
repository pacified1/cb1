<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My AI • Cosmic</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
}

body{

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:#f7f7ff;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(109,72,255,.22),
      transparent 28%
    ),
    radial-gradient(
      circle at 85% 15%,
      rgba(0,196,255,.16),
      transparent 25%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(180,0,255,.13),
      transparent 35%
    ),
    #05050b;

}


/* =========================================================
   SPACE BACKGROUND
========================================================= */

body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  opacity:.65;

  background-image:

    radial-gradient(
      1px 1px at 10% 20%,
      white,
      transparent
    ),

    radial-gradient(
      1px 1px at 25% 75%,
      white,
      transparent
    ),

    radial-gradient(
      1px 1px at 42% 30%,
      white,
      transparent
    ),

    radial-gradient(
      1px 1px at 60% 82%,
      white,
      transparent
    ),

    radial-gradient(
      1px 1px at 75% 25%,
      white,
      transparent
    ),

    radial-gradient(
      1px 1px at 90% 65%,
      white,
      transparent
    );

  background-size:
    180px 180px,
    230px 230px,
    300px 300px,
    260px 260px,
    210px 210px,
    340px 340px;

}


/* =========================================================
   APP
========================================================= */

.app{

  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;

  position:relative;

}


/* =========================================================
   HEADER
========================================================= */

header{

  height:72px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 24px;

  background:
    rgba(8,8,18,.72);

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  border-bottom:
    1px solid rgba(255,255,255,.08);

  box-shadow:
    0 10px 40px rgba(0,0,0,.25);

  z-index:5;

}

.brand{

  display:flex;

  align-items:center;

  gap:12px;

}

.logo{

  width:40px;
  height:40px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #7657ff,
      #32b8ff
    );

  box-shadow:
    0 0 30px rgba(106,79,255,.35);

  font-size:20px;

}

.brand-text{

  display:flex;

  flex-direction:column;

}

.brand-name{

  font-size:16px;

  font-weight:700;

  letter-spacing:-.3px;

}

.brand-sub{

  color:#7e7e98;

  font-size:11px;

  margin-top:2px;

}

.status{

  display:flex;

  align-items:center;

  gap:8px;

  color:#8f8fa5;

  font-size:11px;

}

.status-dot{

  width:7px;
  height:7px;

  border-radius:50%;

  background:#62ffac;

  box-shadow:
    0 0 12px #62ffac;

}


/* =========================================================
   CHAT
========================================================= */

#chat{

  flex:1;

  overflow-y:auto;

  padding:
    35px
    max(20px, calc((100vw - 900px) / 2))
    35px;

  display:flex;

  flex-direction:column;

  gap:18px;

  scroll-behavior:smooth;

}


/* Scrollbar */

#chat::-webkit-scrollbar{
  width:7px;
}

#chat::-webkit-scrollbar-track{
  background:transparent;
}

#chat::-webkit-scrollbar-thumb{

  background:
    rgba(255,255,255,.10);

  border-radius:20px;

}


/* =========================================================
   MESSAGES
========================================================= */

.msg{

  max-width:720px;

  padding:
    14px
    17px;

  border-radius:20px;

  line-height:1.6;

  white-space:pre-wrap;

  font-size:14px;

  animation:
    messageIn .25s ease;

  word-wrap:break-word;

}

@keyframes messageIn{

  from{
    opacity:0;
    transform:translateY(7px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.user{

  align-self:flex-end;

  background:
    linear-gradient(
      135deg,
      #6855ff,
      #447dff
    );

  border:
    1px solid rgba(255,255,255,.12);

  box-shadow:
    0 10px 35px rgba(74,79,255,.20);

  border-bottom-right-radius:7px;

}

.ai{

  align-self:flex-start;

  background:
    linear-gradient(
      135deg,
      rgba(25,25,42,.86),
      rgba(14,14,27,.86)
    );

  border:
    1px solid rgba(255,255,255,.075);

  box-shadow:
    0 12px 40px rgba(0,0,0,.22);

  border-bottom-left-radius:7px;

  backdrop-filter:
    blur(12px);

}


/* =========================================================
   WELCOME
========================================================= */

.welcome{

  margin:auto;

  max-width:600px;

  text-align:center;

  padding:40px 20px;

}

.welcome-orb{

  width:74px;
  height:74px;

  margin:0 auto 20px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  font-size:32px;

  background:
    radial-gradient(
      circle at 35% 30%,
      #bbaeff,
      #7259ff 45%,
      #1d1a4a
    );

  box-shadow:
    0 0 70px rgba(103,78,255,.4);

}

.welcome h1{

  margin:0;

  font-size:28px;

  letter-spacing:-1px;

}

.welcome p{

  color:#85859c;

  line-height:1.6;

  font-size:13px;

}


/* =========================================================
   BOTTOM PANEL
========================================================= */

#bottom{

  padding:
    14px
    max(16px, calc((100vw - 900px) / 2));

  background:
    linear-gradient(
      to top,
      rgba(5,5,11,.98),
      rgba(5,5,11,.84)
    );

  border-top:
    1px solid rgba(255,255,255,.07);

  backdrop-filter:
    blur(24px);

  -webkit-backdrop-filter:
    blur(24px);

}


/* =========================================================
   CONTROLS
========================================================= */

.controls{

  display:flex;

  gap:8px;

  margin-bottom:9px;

  flex-wrap:wrap;

}

input,
button{

  border:0;

  outline:none;

  font-family:inherit;

}


/* API + MODEL */

input[type=text],
input[type=password]{

  flex:1;

  min-width:160px;

  height:40px;

  padding:
    0
    13px;

  border-radius:12px;

  color:#fff;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid rgba(255,255,255,.07);

  transition:.2s;

}

input[type=text]:focus,
input[type=password]:focus{

  border-color:
    rgba(120,100,255,.65);

  box-shadow:
    0 0 0 3px rgba(100,80,255,.10);

}

input::placeholder{

  color:#66667c;

}


/* FILE */

.file{

  height:40px;

  display:flex;

  align-items:center;

  padding:
    0
    14px;

  border-radius:12px;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid rgba(255,255,255,.07);

  color:#aaaabd;

  cursor:pointer;

  font-size:12px;

  transition:.2s;

}

.file:hover{

  background:
    rgba(255,255,255,.09);

  color:white;

}

input[type=file]{

  display:none;

}


/* BUTTONS */

button{

  height:40px;

  padding:
    0
    15px;

  border-radius:12px;

  color:white;

  background:
    rgba(255,255,255,.065);

  border:
    1px solid rgba(255,255,255,.08);

  cursor:pointer;

  transition:
    transform .15s,
    background .15s;

}

button:hover{

  background:
    rgba(255,255,255,.12);

}

button:active{

  transform:scale(.97);

}

#sendButton{

  min-width:90px;

  background:
    linear-gradient(
      135deg,
      #7258ff,
      #4c8cff
    );

  border:0;

  box-shadow:
    0 8px 25px rgba(87,73,255,.25);

}

#sendButton:hover{

  background:
    linear-gradient(
      135deg,
      #8068ff,
      #5c98ff
    );

}


/* =========================================================
   LEARNED INFO
========================================================= */

#learned{

  color:#66667c;

  font-size:10px;

  margin:
    2px
    3px
    10px;

}


/* =========================================================
   INPUT
========================================================= */

.chat-input{

  display:flex;

  gap:9px;

}

#input{

  flex:1;

  height:48px;

  padding:
    0
    17px;

  border-radius:16px;

  color:white;

  background:
    rgba(255,255,255,.06);

  border:
    1px solid rgba(255,255,255,.08);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.03);

  transition:.2s;

}

#input:focus{

  border-color:
    rgba(118,91,255,.6);

  box-shadow:
    0 0 0 4px rgba(104,80,255,.09);

}

#input::placeholder{

  color:#68687e;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

  header{

    padding:0 15px;

  }

  .brand-sub{

    display:none;

  }

  #chat{

    padding:
      22px
      14px;

  }

  .msg{

    max-width:88%;

    font-size:14px;

  }

  #bottom{

    padding:
      10px;

  }

  input[type=text],
  input[type=password]{

    min-width:130px;

  }

  .status{

    display:none;

  }

}

</style>

</head>


<body>

<div class="app">


<header>

  <div class="brand">

    <div class="logo">
      ✦
    </div>

    <div class="brand-text">

      <div class="brand-name">
        My AI
      </div>

      <div class="brand-sub">
        personal cosmic assistant
      </div>

    </div>

  </div>


  <div class="status">

    <span class="status-dot"></span>

    Gemini online

  </div>

</header>


<div id="chat">

  <div class="welcome">

    <div class="welcome-orb">
      ✦
    </div>

    <h1>
      What are we thinking about?
    </h1>

    <p>
      Upload a chat log to teach the AI your vibe,
      slang, emojis and writing style.
    </p>

  </div>

</div>


<div id="bottom">


  <!-- API SETTINGS -->

  <div class="controls">

    <label class="file">

      📁
      <span style="margin-left:7px">
        Upload chat
      </span>

      <input
        id="file"
        type="file"
        accept=".txt,.json,.csv,.md,.html,.htm"
      >

    </label>


    <input
      id="apiKey"
      type="password"
      placeholder="Gemini API key"
    >


    <input
      id="model"
      type="text"
      value="gemini-3.6-flash"
      placeholder="Gemini model"
    >


    <button
      onclick="clearData()"
    >
      Clear
    </button>

  </div>


  <div id="learned">
    No personality learned yet.
  </div>


  <!-- CHAT INPUT -->

  <div class="chat-input">

    <input
      id="input"
      type="text"
      placeholder="Message My AI..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      onclick="send()"
    >
      Send ✦
    </button>

  </div>

</div>

</div>


<script>

/* =========================================================
   PERSONALITY MEMORY
========================================================= */

let trainingData = "";

let personality = {

  slang: [],
  emojis: [],
  phrases: [],
  style: ""

};


/* =========================================================
   FILE READER
========================================================= */

document
.getElementById("file")
.addEventListener(
  "change",
  async function(e){

    const file =
      e.target.files[0];

    if(!file) return;

    try{

      let text =
        await file.text();


      /* JSON */

      if(
        file.name
        .toLowerCase()
        .endsWith(".json")
      ){

        try{

          const json =
            JSON.parse(text);

          text =
            JSON.stringify(
              json,
              null,
              2
            );

        }catch{}

      }


      /* HTML */

      if(
        file.name
        .toLowerCase()
        .endsWith(".html")
        ||
        file.name
        .toLowerCase()
        .endsWith(".htm")
      ){

        const parser =
          new DOMParser();

        const doc =
          parser.parseFromString(
            text,
            "text/html"
          );

        text =
          doc.body.innerText;

      }


      trainingData =
        text;


      learnFromText(text);


      document
      .getElementById("learned")
      .textContent =
        `Learned ${
          text.length.toLocaleString()
        } characters • ${
          personality.emojis.length
        } emojis • ${
          personality.slang.length
        } slang patterns`;


      document
      .getElementById("file");


    }

    catch(err){

      alert(
        "Couldn't read file: "
        + err.message
      );

    }

  }
);


/* =========================================================
   LEARN STYLE
========================================================= */

function learnFromText(text){

  const lower =
    text.toLowerCase();


  /* EMOJIS */

  const emojiMatches =
    text.match(
      /[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu
    ) || [];


  personality.emojis =
    [...new Set(emojiMatches)]
    .slice(0,80);


  /* SLANG */

  const slangWords = [

    "lol",
    "lmao",
    "lmfao",
    "omg",
    "wtf",
    "wth",
    "bruh",
    "bro",
    "nah",
    "fr",
    "frfr",
    "ngl",
    "idk",
    "ik",
    "ikr",
    "tbh",
    "imo",
    "imho",
    "rn",
    "bc",
    "cuz",
    "cause",
    "gonna",
    "wanna",
    "ykwim",
    "lowkey",
    "highkey",
    "deadass",
    "sus",
    "no cap",
    "cap",
    "bet",
    "yo",
    "yoo",
    "😭",
    "💀",
    "😂",
    "🤣"

  ];


  personality.slang =
    slangWords.filter(
      x => lower.includes(x)
    );


  /* COMMON WORDS */

  const words =
    lower
    .replace(/[^\w\s']/g," ")
    .split(/\s+/)
    .filter(
      x => x.length > 2
    );


  const counts = {};


  for(
    const word of words
  ){

    counts[word] =
      (counts[word] || 0) + 1;

  }


  personality.phrases =
    Object.entries(counts)
    .sort(
      (a,b) => b[1] - a[1]
    )
    .slice(0,30)
    .map(
      x => x[0]
    );


  /* MESSAGE LENGTH */

  const sentences =
    text
    .split(/[.!?]+/)
    .filter(Boolean);


  const avgLength =
    sentences.length

    ? sentences.reduce(
        (a,b) =>
          a + b.length,
        0
      ) / sentences.length

    : 0;


  personality.style =

    avgLength < 60

    ? "short, casual messages"

    : avgLength < 130

    ? "medium-length conversational messages"

    : "longer detailed messages";

}


/* =========================================================
   PERSONALITY PROMPT
========================================================= */

function buildPersonalityPrompt(){

  return `

You are a conversational AI.

Your job is to naturally match the communication style
of the uploaded chat data.

IMPORTANT:

- Do not claim to literally be the person from the chat.
- Do not expose private chat data.
- Do not copy entire messages from the uploaded data.
- Use the data mainly to understand communication style.
- Match the user's energy naturally.
- Use slang only when it feels natural.
- Do not randomly add emojis to every response.
- Keep responses conversational and human.
- Avoid sounding like a corporate assistant unless the user
  asks for a formal answer.

LEARNED WRITING STYLE:

${personality.style}

COMMON SLANG:

${personality.slang.join(", ")}

COMMON EMOJIS:

${personality.emojis.join(" ")}

COMMON WORDS:

${personality.phrases.join(", ")}

REFERENCE CHAT DATA:

${trainingData.slice(-8000)}

`;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function send(){

  const input =
    document.getElementById("input");

  const message =
    input.value.trim();


  if(!message)
    return;


  const apiKey =
    document
    .getElementById("apiKey")
    .value
    .trim();


  if(!apiKey){

    alert(
      "Enter your Gemini API key first."
    );

    return;

  }


  addMessage(
    message,
    "user"
  );


  input.value = "";


  const loading =
    addMessage(
      "",
      "ai"
    );


  try{

    const model =
      document
      .getElementById("model")
      .value
      .trim()
      ||
      "gemini-3.6-flash";


    const systemInstruction =
      buildPersonalityPrompt();


    /*
      Gemini Interactions API
      Streaming SSE
    */

    const response =
      await fetch(

        "https://generativelanguage.googleapis.com/v1beta/interactions?alt=sse",

        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "x-goog-api-key":
              apiKey

          },

          body:JSON.stringify({

            model:model,

            system_instruction:
              systemInstruction,

            input:message,

            stream:true,

            store:false,

            generation_config:{

              thinking_level:
                "minimal",

              max_output_tokens:
                800

            }

          })

        }

      );


    if(!response.ok){

      const errorData =
        await response
        .json()
        .catch(
          () => ({})
        );


      throw new Error(

        errorData
        ?.error
        ?.message

        ||

        "Gemini API request failed."

      );

    }


    if(!response.body){

      throw new Error(
        "Streaming is not supported by this browser."
      );

    }


    const reader =
      response.body.getReader();


    const decoder =
      new TextDecoder();


    let buffer = "";

    let answer = "";


    /*
      Read SSE stream
    */

    while(true){

      const {
        value,
        done
      } =
        await reader.read();


      if(done)
        break;


      buffer +=
        decoder.decode(
          value,
          {
            stream:true
          }
        );


      /*
        SSE events are separated
        by a blank line.
      */

      const events =
        buffer.split("\n\n");


      buffer =
        events.pop()
        || "";


      for(
        const event
        of events
      ){

        let eventType =
          "";

        let dataText =
          "";


        const lines =
          event.split("\n");


        for(
          const line
          of lines
        ){

          if(
            line.startsWith(
              "event:"
            )
          ){

            eventType =
              line
              .slice(6)
              .trim();

          }


          if(
            line.startsWith(
              "data:"
            )
          ){

            dataText +=
              line
              .slice(5)
              .trim();

          }

        }


        if(!dataText)
          continue;


        if(
          dataText ===
          "[DONE]"
        ){

          continue;

        }


        let data;


        try{

          data =
            JSON.parse(
              dataText
            );

        }

        catch{

          continue;

        }


        /*
          Current Interactions API:
          text comes through step.delta
        */

        if(

          eventType ===
          "step.delta"

          &&

          data.delta

          &&

          data.delta.type ===
          "text"

        ){

          const chunk =
            data
            .delta
            .text
            || "";


          answer +=
            chunk;


          loading.textContent =
            answer;


          const chat =
            document
            .getElementById(
              "chat"
            );


          chat.scrollTop =
            chat.scrollHeight;

        }


        /*
          API error event
        */

        if(
          eventType ===
          "error"
        ){

          throw new Error(

            data
            ?.error
            ?.message

            ||

            "Gemini streaming error."

          );

        }

      }

    }


    if(!answer.trim()){

      loading.textContent =
        "❌ Gemini returned no text.";

    }

  }


  catch(err){

    loading.textContent =
      "❌ " +
      err.message;

  }

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
  text,
  type
){

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "msg " + type;


  div.textContent =
    text;


  document
  .getElementById("chat")
  .appendChild(div);


  const chat =
    document
    .getElementById("chat");


  chat.scrollTop =
    chat.scrollHeight;


  return div;

}


/* =========================================================
   CLEAR LEARNED DATA
========================================================= */

function clearData(){

  trainingData =
    "";


  personality = {

    slang:[],
    emojis:[],
    phrases:[],
    style:""

  };


  document
  .getElementById("learned")
  .textContent =
    "No personality learned yet.";

}


/* =========================================================
   ENTER KEY
========================================================= */

document
.getElementById("input")
.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "Enter"
    ){

      event.preventDefault();

      send();

    }

  }
);

</script>

</body>

</html>
